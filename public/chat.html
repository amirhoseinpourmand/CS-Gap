<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتاق | CS Gap</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css" integrity="sha256-mmgLkCYLUQbXn0B1SRqzHar6dCnv9oZFPEC1g1cwlkk=" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="chat-page">
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-start">
        <button type="button" id="sidebar-toggle" class="icon-btn only-mobile" aria-label="لیست اعضا">
          <i class="fas fa-users"></i>
        </button>
        <div class="brand"><i class="fas fa-comments"></i> CS Gap</div>
        <span class="room-badge"><i class="fas fa-hashtag"></i> <span id="room-title"></span></span>
      </div>
      <div class="header-end">
        <span class="status" id="status" title="وضعیت اتصال"><i class="dot"></i><span id="status-text">در حال اتصال…</span></span>
        <button type="button" class="icon-btn theme-toggle" onclick="toggleTheme()" title="تغییر تم" aria-label="تغییر تم">
          <i class="fas fa-moon"></i><i class="fas fa-sun"></i>
        </button>
        <a href="index.html" class="btn btn-leave"><i class="fas fa-sign-out-alt"></i> <span>ترک اتاق</span></a>
      </div>
    </header>

    <main class="chat-main">
      <aside class="chat-sidebar" id="sidebar">
        <div class="side-block">
          <h3><i class="fas fa-comments"></i> نام اتاق</h3>
          <h2 id="room-name"></h2>
        </div>
        <div class="side-block">
          <h3><i class="fas fa-users"></i> اعضا <span class="count" id="users-count">0</span></h3>
          <ul id="users"></ul>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <section class="chat-area">
        <div class="chat-messages" id="messages"></div>
        <button type="button" class="scroll-down" id="scroll-down" aria-label="رفتن به آخرین پیام">
          <i class="fas fa-chevron-down"></i> <span>پیام جدید</span>
        </button>
        <div class="typing" id="typing"></div>
      </section>
    </main>

    <div class="chat-form-container">
      <form id="chat-form" autocomplete="off">
        <input
          id="msg"
          type="text"
          dir="auto"
          placeholder="پیام خود را بنویسید…"
          maxlength="500"
          required
          autocomplete="off"
        />
        <button class="btn btn-send" type="submit"><i class="fas fa-paper-plane"></i> <span>ارسال</span></button>
      </form>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card">
      <i class="fas fa-exclamation-circle"></i>
      <p id="overlay-text"></p>
      <a href="index.html" class="btn">بازگشت</a>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
